<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Белгілі формулалар</title>
</head>
<body>

    <h1>Белгілі формулалар</h1>

    <h2>Химия</h2>
    <p>
        Су: <b>H<sub>2</sub>O</b><br>
        Көмірқышқыл газы: <b>CO<sub>2</sub></b><br>
        Күкірт қышқылы: <b>H<sub>2</sub>SO<sub>4</sub></b>
    </p>

    <h2>Физика</h2>
    <p><b>E = mc<sup>2</sup></b> — <i>Альберт Эйнштейн</i></p>

    <h2>Математика</h2>
    <p>Пифагор теоремасы: <b>a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></b></p>

    <hr>

    <p><font color="blue">Информатикада:</font> 1 Кбайт = 2<sup>10</sup> байт = <u>1024 байт</u></p>

</body>
</html>
